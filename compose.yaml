name: delivery-recovery

services:
  app:
    image: ${DELIVERY_RECOVERY_IMAGE:-delivery-recovery:local}
    container_name: delivery-recovery
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
    restart: "no"
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DELIVERY_RECOVERY_DATA_DIR: /data
      DELIVERY_RECOVERY_MAX_QUEUED_JOBS: "4"
      DELIVERY_RECOVERY_LEASE_SECONDS: "30"
      DELIVERY_RECOVERY_PENDING_RETENTION_SECONDS: "86400"
    volumes:
      - ${DELIVERY_RECOVERY_DATA_HOST:-./var/container-data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
